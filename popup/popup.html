<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="fx-popup-container">
    <!-- Minimal Tesla Header -->
    <header class="fx-header">
      <div class="fx-brand">
        <svg
          width="22"
          height="22"
          viewBox="0 0 512 512"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="fx-brand-logo"
          aria-label="FX English Logo"
        >
          <defs>
            <linearGradient id="fxRedPopup" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF333E" />
              <stop offset="100%" stop-color="#E50914" />
            </linearGradient>
            <filter id="fxRedGlowPopup" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#E50914" flood-opacity="0.45" />
            </filter>
            <mask id="slashGapPopup">
              <rect x="0" y="0" width="512" height="512" fill="white" />
              <line x1="436" y1="116" x2="236" y2="396" stroke="black" stroke-width="80" stroke-linecap="round" />
            </mask>
          </defs>
          <path
            d="M80 104 H224 C235 104 242 111 242 120 V148 C242 157 235 164 224 164 H142 C135 164 130 169 130 176 V224 C130 231 135 236 142 236 H204 C215 236 222 243 222 252 V280 C222 289 215 296 204 296 H142 C135 296 130 301 130 308 V392 C130 401 123 408 114 408 H80 C71 408 64 401 64 392 V120 C64 111 71 104 80 104 Z"
            fill="currentColor"
          />
          <line
            x1="236"
            y1="116"
            x2="436"
            y2="396"
            stroke="currentColor"
            stroke-width="58"
            stroke-linecap="round"
            mask="url(#slashGapPopup)"
          />
          <line
            x1="436"
            y1="116"
            x2="236"
            y2="396"
            stroke="url(#fxRedPopup)"
            stroke-width="58"
            stroke-linecap="round"
            filter="url(#fxRedGlowPopup)"
          />
        </svg>
        <span class="fx-brand-title">FX English</span>
      </div>
      <button id="fx-btn-open-studio" class="fx-btn-icon-header" title="Mở FX Studio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"/>
          <path d="M7 7h10v10"/>
        </svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="fx-main">
      <!-- Media Active State (YouTube / Netflix) -->
      <section id="fx-media-card" class="fx-card fx-media-card" style="display:none;">
        <div class="fx-card-meta-row">
          <div class="fx-platform-wrap">
            <span class="fx-platform-dot"></span>
            <span id="fx-platform-badge" class="fx-platform-tag">NETFLIX</span>
          </div>
          <span id="fx-track-status" class="fx-track-status">EN</span>
        </div>

        <h2 id="fx-media-title" class="fx-media-title">Đang tải thông tin video...</h2>

        <div class="fx-card-actions">
          <button id="fx-btn-quick-vocab" class="fx-btn-tesla-primary">
            <span>Tách từ vựng</span>
          </button>
        </div>

        <div class="fx-download-bar">
          <span class="fx-dl-label">Tải xuống</span>
          <div class="fx-dl-group">
            <button id="fx-btn-dl-srt" class="fx-btn-text-dl" title="Tải file SRT">SRT</button>
            <span class="fx-dl-divider">|</span>
            <button id="fx-btn-dl-vtt" class="fx-btn-text-dl" title="Tải file WebVTT">VTT</button>
            <span class="fx-dl-divider">|</span>
            <button id="fx-btn-dl-txt" class="fx-btn-text-dl" title="Tải transcript TXT">TXT</button>
          </div>
        </div>
      </section>

      <!-- Media Inactive / Idle State -->
      <section id="fx-idle-card" class="fx-card fx-idle-card">
        <div class="fx-idle-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </div>
        <h3 class="fx-idle-title">Không phát hiện video</h3>
        <p class="fx-idle-desc">
          Mở một video trên YouTube hoặc bộ phim trên Netflix có phụ đề để tự động trích xuất từ vựng.
        </p>
      </section>
    </main>

    <!-- Minimalist Tesla Popup Toast -->
    <div id="fx-popup-toast" class="fx-popup-toast" style="display:none;">
      <span class="fx-popup-toast-dot" id="fx-popup-toast-dot"></span>
      <span class="fx-popup-toast-msg" id="fx-popup-toast-msg"></span>
    </div>
  </div>

  <script src="../lib/subtitleParser.js"></script>
  <script src="../lib/masterList.js"></script>
  <script src="popup.js"></script>
</body>
</html>
