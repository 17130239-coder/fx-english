<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .fx-mono { fill: #FFFFFF; stroke: #FFFFFF; }
      @media (prefers-color-scheme: light) {
        .fx-mono { fill: #111113; stroke: #111113; }
      }
    </style>
    <linearGradient id="fxRedT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333E" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="fxRedGlowT" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#E50914" flood-opacity="0.45" />
    </filter>
    <mask id="slashGapT">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
      <line x1="436" y1="116" x2="236" y2="396" stroke="#000000" stroke-width="80" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Letter F -->
  <path class="fx-mono"
        d="M80 104
           H224 C235 104 242 111 242 120 V148 C242 157 235 164 224 164
           H142 C135 164 130 169 130 176 V224 C130 231 135 236 142 236
           H204 C215 236 222 243 222 252 V280 C222 289 215 296 204 296
           H142 C135 296 130 301 130 308 V392 C130 401 123 408 114 408
           H80 C71 408 64 401 64 392 V120 C64 111 71 104 80 104
           Z" />

  <!-- Letter X: Diagonal Arm 1 with mask gap -->
  <line class="fx-mono"
        x1="236" y1="116" x2="436" y2="396"
        stroke-width="58" stroke-linecap="round"
        mask="url(#slashGapT)" />

  <!-- Letter X: Dynamic Netflix Red Diagonal Arm 2 -->
  <line x1="436" y1="116" x2="236" y2="396"
        stroke="url(#fxRedT)" stroke-width="58" stroke-linecap="round"
        filter="url(#fxRedGlowT)" />
</svg>